name: Pro Kernel Builder
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev flex bison libelf-dev

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # الغاء الاعتماد على ccache لتجنب الخطأ
          export USE_CCACHE=0
          
          make exynos7885-jackpotlte_eur_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Kernel
          path: arch/arm64/boot/Image.gz-dtb
          
